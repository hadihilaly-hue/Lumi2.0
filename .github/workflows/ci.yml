name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lambda/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Lambda dependencies
        run: npm ci
        working-directory: lambda

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Lambda tests
        run: npm test
        working-directory: lambda
